name: multi_crop_disease_detector
description: Plant disease detection using TensorFlow Lite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  camera: ^0.12.0+1
  tflite_flutter: ^0.12.1
  tflite_web: ^0.4.0
  image: ^4.5.4
  image_picker: ^1.2.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  fl_chart: ^1.1.0
  shared_preferences: ^2.3.3
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/models/
    - assets/labels/
    - assets/data/
